# Where the translations live, and what to generate from them.
#
# The generated code lands in lib/l10n/generated rather than in a hidden
# package, so it can be read, searched and reviewed like anything else here.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: L10n
output-dir: lib/l10n/generated
nullable-getter: false
