name: the_accountant
description: "A personal finance management application with a focus on privacy, local-first storage, and beautiful UI/UX."

publish_to: 'none'

version: 4.1.0+29

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State management
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  
  # Database
  drift: ^2.32.0
  # Direct because `constructDbForFile` sets a busy timeout through drift's
  # `setup:` callback, which hands over a `CommonDatabase` from this package.
  # It was already here transitively; naming it stops a drift upgrade quietly
  # taking the type away.
  sqlite3: ^3.5.2
  drift_flutter: ^0.3.0
  
  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  firebase_analytics: ^12.0.0
  firebase_messaging: ^16.0.0
  firebase_crashlytics: ^5.0.7
  
  # UI/Animations
  flutter_markdown_plus: ^1.0.7
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  animated_text_kit: ^4.2.2
  fl_chart: ^1.0.0
  shimmer: ^4.0.0
  flutter_animate: ^4.3.0
  auto_size_text: ^3.0.0
  tutorial_coach_mark: ^1.3.3
  
  # Networking and APIs
  http: ^1.2.2
  dio: ^5.4.0
  google_sign_in: ^7.1.1
  logger: ^2.0.2
  # Environment
  flutter_dotenv: ^6.0.0
  
  # Security
  flutter_secure_storage: ^11.0.0
  local_auth: ^3.0.1
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.5
  crypto: ^3.0.5
  path: ^1.9.0
  path_provider: ^2.1.5
  share_plus: ^13.2.0
  url_launcher: ^6.3.0
  permission_handler: ^13.0.1
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  flutter_timezone: ^5.0.1
  pdf: ^3.10.8
  printing: ^5.12.6
  image_picker: ^1.0.4
  # OpenIAP. Pins openiap-google 3.5.1, which brings Play Billing 9.1.0 -
  # Play requires 8+ for new uploads from 2026-11-01.
  flutter_inapp_purchase: ^10.6.1
  
  # Device Info
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.0

  # OCR
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_barcode_scanning: ^0.16.1
  google_mlkit_image_labeling: ^0.16.1
  shared_preferences: ^2.5.4
  workmanager: ^0.10.9
  connectivity_plus: ^7.0.0
  # google_mlkit_face_detection: 0.12.0  # Commenting out as not needed for receipts

  in_app_update: ^5.0.0
  file_picker: ^12.2.0
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.1
  app_links: ^7.2.1
  quick_actions: ^1.1.0
  # Holds the native splash until the first Flutter frame (see main.dart).
  flutter_native_splash: ^2.4.8
  material_symbols_icons: ^4.2960.0
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code generation
  riverpod_generator: ^4.0.3
  drift_dev: ^2.32.1
  build_runner: ^2.11.1
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true

  # Generate lib/l10n/generated from the ARB files on every build.
  generate: true

  assets:
    - .env
    - assets/legal/
    - assets/logo/
    - assets/launcher/splash-glyph.png
    - assets/launcher/splash-background.png
    - assets/launcher/splash-glyph-dark.png
    - assets/launcher/splash-background-dark.png

  # Lexend, instanced from the variable font into static weights so that a
  # plain `FontWeight` picks the right face on every engine.
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Light.ttf
          weight: 300
        - asset: assets/fonts/Lexend-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lexend-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lexend-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lexend-Bold.ttf
          weight: 700
  #   - assets/
  #   - assets/animations/
  #   - assets/icons/
  #   - assets/images/

# Launcher icons: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: "ic_launcher"
  image_path_android: "assets/launcher/app-icon-1024.png"
  adaptive_icon_foreground: "assets/launcher/android-adaptive-foreground-432.png"
  adaptive_icon_background: "assets/launcher/android-adaptive-background-432.png"
  adaptive_icon_monochrome: "assets/launcher/android-monochrome-432.png"
  # The handoff layers are already drawn inside the safe zone.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
  ios: true
  image_path_ios: "assets/launcher/app-icon-square-1024.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/launcher/app-icon-1024.png"
    background_color: "#FFFAF6"
    theme_color: "#F97316"

# Native splash: `dart run flutter_native_splash:create`
#
# One orange ground with the white glyph in light and dark: the launch moment
# is the brand, whatever the phone's mode. The Flutter intro starts from this
# exact frame and then settles on the app's own theme, fading to the dark
# intro when the app is dark.
#
# 4x assets: 1024px canvas -> 256dp, glyph at 45%. Android 12 crops rather than
# scales: 1152px canvas, glyph kept inside the centred 768px circle.
flutter_native_splash:
  color: "#F97316"
  background_image: assets/launcher/splash-background.png
  image: assets/launcher/splash-glyph.png
  color_dark: "#F97316"
  background_image_dark: assets/launcher/splash-background.png
  image_dark: assets/launcher/splash-glyph.png
  android_12:
    color: "#F97316"
    image: assets/launcher/android12-splash-glyph.png
    icon_background_color: "#F97316"
    color_dark: "#F97316"
    image_dark: assets/launcher/android12-splash-glyph.png
    icon_background_color_dark: "#F97316"
  ios: true
  android: true
  web: false
  fullscreen: false
