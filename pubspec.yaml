name: the_accountant
description: "A personal finance management application with a focus on privacy, local-first storage, and beautiful UI/UX."

publish_to: 'none'

version: 1.2.0+17

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State management
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  
  # Database
  drift: ^2.32.0
  drift_flutter: ^0.3.0
  
  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  firebase_analytics: ^12.0.0
  firebase_messaging: ^16.0.0
  firebase_crashlytics: ^5.0.7
  
  # UI/Animations
  flutter_markdown_plus: ^1.0.7
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  animated_text_kit: ^4.2.2
  fl_chart: ^1.0.0
  google_fonts: ^8.0.0
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0
  auto_size_text: ^3.0.0
  tutorial_coach_mark: ^1.3.3
  
  # Networking and APIs
  http: ^1.2.2
  dio: ^5.4.0
  google_sign_in: ^7.1.1
  sign_in_with_apple: ^8.1.0
  logger: ^2.0.2
  # Environment
  flutter_dotenv: ^6.0.0
  
  # Security
  flutter_secure_storage: ^10.0.0
  local_auth: ^3.0.1
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.5
  crypto: ^3.0.5
  path: ^1.9.0
  path_provider: ^2.1.5
  share_plus: ^13.2.0
  url_launcher: ^6.3.0
  permission_handler: ^12.0.1
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  flutter_timezone: ^5.0.1
  pdf: ^3.10.8
  printing: ^5.12.6
  image_picker: ^1.0.4
  in_app_purchase: ^3.1.11
  
  # Device Info
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.0

  # OCR
  # SIMULATOR-MODE-DISABLED google_mlkit_text_recognition: ^0.16.0
  # SIMULATOR-MODE-DISABLED google_mlkit_barcode_scanning: ^0.15.0
  # SIMULATOR-MODE-DISABLED google_mlkit_image_labeling: ^0.15.0
  shared_preferences: ^2.5.4
  workmanager: ^0.9.0
  connectivity_plus: ^7.0.0
  # google_mlkit_face_detection: 0.12.0  # Commenting out as not needed for receipts

  in_app_purchase_android: ^0.5.1
  in_app_update: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code generation
  riverpod_generator: ^4.0.3
  drift_dev: ^2.32.1
  build_runner: ^2.11.1


# TODO: Remove this override once riverpod_generator supports analyzer 13+,
# then run `flutter pub upgrade --major-versions` to move drift_dev to 2.34.2+.
# Pin sqlparser: drift_dev is held at 2.34.0 because drift_dev 2.34.2 needs
# analyzer ^13, while riverpod_generator (latest, 4.0.4) still caps analyzer at
# ^12 — the two code generators can't coexist yet. drift_dev 2.34.0 calls
# DartPlaceholder.when(), which sqlparser removed in 0.44.6's sealed-class
# refactor, so pin to 0.44.5. Remove this once riverpod_generator supports
# analyzer 13+ and drift_dev can move to 2.34.2.
dependency_overrides:
  sqlparser: 0.44.5

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/legal/
  #   - assets/
  #   - assets/animations/
  #   - assets/icons/
  #   - assets/images/
